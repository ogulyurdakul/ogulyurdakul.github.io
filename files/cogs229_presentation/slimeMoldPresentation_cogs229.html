<div>

<p>dark: easy<br />
gray: difficult</p>
</div>

<p><img src="satResult.png" alt="" style="height:430px;" /></p>
</div>
</div>
</div>
<div>
<h4 id="independence-of-irrelevant-alternatives">Independence of Irrelevant Alternatives</h4>

<div>
<p><img src="iiaSetup.jpg" alt="" style="width:290px;" /></p>
<p>dark: two-choice setup<br />
gray: three-choice setup</p>

<h3 id="monte-carlo-based-models">Monte Carlo-based models</h3>

<p>simple actions of little particles can give rise to complex behavior at the population level...</p>
<div class="columns2" style="grid-template-columns: 2fr 3fr">
<div>
<p>Jones (2010)'s model:</p>
<p><img src="MCalgo.png" alt="center" style="width:300px;" /><br />
<img src="MCunit.png" alt="center" style="width:300px;" /></p>
</div>
<div>
<p><strong>can we build on this?</strong></p>
<ul>
<li>say each particle &quot;looks&quot; at all the nodes it can travel to and assigns a positive &quot;score&quot; to each of them
<ul>
<li>softmax decision:
<ul>
<li>sample the next node proportional to these scores</li>
</ul>
</li>
<li>Metropolis-Hastings decision:
<ul>
<li>sample a candidate next node
<ul>
<li>if better, move there</li>
<li>if worse, move or stay probabilistically</li>
</ul>
</li>
</ul>
</li>
</ul>
</li>
</ul>
</div>
</div>
<footer> Jones (2010) “The emergence and dynamical evolution of complex transport networks from simple low-level behaviours,”  <a href="https://www.scopus.com/pages/publications/77949441365">https://www.scopus.com/pages/publications/77949441365</a> </footer>
</section>

<h3 id="shortcomings-of-the-current-models">Shortcomings of the current models</h3>
<div class="columns2" style="grid-template-columns: 2fr 3fr">
<div>
<p>Tero et al. (2007):</p>
<p><img src="circuit.png" alt="center" style="height:200px;" /></p>
</div>
<div>
<ul>
